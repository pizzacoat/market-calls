# Historical events for the practice app.
#
# `brief` describes only what was known BEFORE the market's reaction, so it
# never gives the answer away. Market moves are NOT typed here: GitHub Actions
# computes them from Yahoo Finance and FRED (scripts/build_practice_bank.py)
# and writes practice/bank.json.
#
# date: the trading day the market reacted (previous close -> this close)
# focus: the asset the Level 1 question asks about (spx, or a stock ticker)
# sectors: four sector ETFs for the "which did best / worst" question

events:
  - id: cpi-2022-09
    date: 2022-09-13
    category: Inflation
    title: August 2022 CPI
    brief: >-
      Tuesday 8:30 ET. Stocks had rallied for four straight days on hopes that inflation
      had peaked, with gasoline prices falling all summer. Economists expected headline CPI
      to slow to 8.1% year over year and to slip 0.1% on the month. The report showed 8.3%
      year over year and a 0.1% monthly rise. Core inflation, which strips out food and
      energy, rose 0.6% on the month, double the expected 0.3%, taking it to 6.3% year over year.
    focus: spx
    sectors: [XLK, XLE, XLU, XLP]
    explanation: >-
      The market had priced in a peak in inflation and the rally rested on that hope. A hot
      core number (the part the Fed watches most) meant the Fed would keep hiking hard, so
      2-year yields jumped and the dollar rose. Long-duration growth stocks are hurt most by
      higher rates, so tech led the fall. The size of the drop reflects positioning: when
      everyone leans one way before the data, a surprise the other way hits hardest.
    lesson: The surprise versus what is priced in matters more than the number itself.

  - id: cpi-2022-11
    date: 2022-11-10
    category: Inflation
    title: October 2022 CPI
    brief: >-
      Thursday 8:30 ET. The Fed had just raised rates by 0.75 point for the fourth meeting in
      a row, and stocks were near their lows for the year. Economists expected headline CPI of
      7.9% year over year and core CPI of 6.5%. The report showed headline at 7.7% and core at
      6.3%, with core rising 0.3% on the month against an expected 0.5%.
    focus: spx
    sectors: [XLK, XLRE, XLE, XLP]
    explanation: >-
      This was the first clear sign that inflation had turned. Markets moved fast to price a
      slower pace of Fed hikes, so yields and the dollar fell sharply. Assets most sensitive to
      rates, such as tech, real estate and other long-duration growth stocks, jumped the most.
      Defensive sectors such as staples lagged because investors moved into risk.
    lesson: When the market is positioned for bad news, a modest good surprise can spark a huge rally.

  - id: cpi-2024-04
    date: 2024-04-10
    category: Inflation
    title: March 2024 CPI
    brief: >-
      Wednesday 8:30 ET. Markets had priced roughly two to three Fed rate cuts in 2024, with
      the first expected by June. Economists expected headline CPI of 3.4% year over year and
      core CPI up 0.3% on the month. The report showed headline at 3.5% and core up 0.4%, the
      third hot monthly core reading in a row.
    focus: spx
    sectors: [IWM, XLRE, XLK, XLE]
    explanation: >-
      A third hot month made it hard to argue the earlier readings were noise, so traders
      pushed back the expected first rate cut. Yields rose sharply across the curve and the
      dollar strengthened. Small caps and real estate, which depend most on cheaper borrowing,
      fell hardest.
    lesson: A pattern of surprises moves markets more than a single one, because it changes the story.

  - id: cpi-2024-05
    date: 2024-05-15
    category: Inflation
    title: April 2024 CPI
    brief: >-
      Wednesday 8:30 ET. After three hot inflation reports in a row, investors worried rate cuts
      would be pushed into 2025. Economists expected core CPI to rise 0.3% on the month after
      0.4% in each of the prior three months. Core rose 0.3%, in line, and headline CPI was 3.4%
      year over year, also in line. Retail sales, released at the same time, were flat for April,
      weaker than the expected 0.4% gain.
    focus: spx
    sectors: [XLK, XLRE, XLE, XLP]
    explanation: >-
      An in-line number counted as relief after three hot ones, and soft retail sales added to
      hopes the economy was cooling just enough. Yields fell, and stocks rose to record highs.
      Rate-sensitive groups did well.
    lesson: Whether a print is good or bad depends on the previous trend and the fears going in, not only the consensus.

  - id: cpi-2024-07
    date: 2024-07-11
    category: Inflation
    title: June 2024 CPI
    brief: >-
      Thursday 8:30 ET. The S&P 500 had risen for seven straight sessions, led by a handful of
      mega-cap tech stocks, while small caps lagged badly. Economists expected headline CPI to
      rise 0.1% on the month. It fell 0.1%, the first monthly decline since 2020, and core rose
      just 0.1% against an expected 0.2%.
    focus: spx
    sectors: [IWM, XLK, XLRE, SMH]
    explanation: >-
      Cooler inflation raised odds of a September rate cut, but money did not flow into the
      winners. Investors sold crowded mega-cap tech and bought what had lagged and would gain
      most from lower rates: small caps, regional banks and real estate. The S&P 500, heavy in
      tech, fell even as most stocks rose. This was a rotation, not a sell-off.
    lesson: Good news can still sink an index when it triggers a rotation out of the crowded winners.

  - id: jobs-2023-02
    date: 2023-02-03
    category: Jobs
    title: January 2023 jobs report
    brief: >-
      Friday 8:30 ET. Stocks had started 2023 strongly on hopes the Fed was nearly done hiking;
      two days earlier Powell had said "disinflation" had started. Economists expected about
      190,000 jobs added in January. The report showed 517,000, and the unemployment rate fell
      to 3.4%, the lowest since 1969.
    focus: spx
    sectors: [XLK, XLF, XLE, XLU]
    explanation: >-
      A very strong labor market meant wage pressure and more Fed hikes, undercutting the
      "Fed is almost done" rally. Yields and the dollar rose. Stocks fell, though less dramatically
      than after a hot CPI, because strong jobs also mean a healthier economy.
    lesson: In an inflation scare, strong economic data is bad news for stocks because it means more Fed tightening.

  - id: jobs-2024-08
    date: 2024-08-02
    category: Jobs
    title: July 2024 jobs report
    brief: >-
      Friday 8:30 ET. Two days earlier the Fed had held rates but hinted at a September cut.
      Earnings from some big tech firms had disappointed. Economists expected about 175,000
      jobs. The report showed 114,000, and unemployment rose to 4.3%, triggering the "Sahm
      rule", a recession signal based on the rise in unemployment.
    focus: spx
    sectors: [XLK, IWM, XLU, XLP]
    explanation: >-
      The mood flipped from "rates will fall" to "the economy might be breaking". Yields fell
      sharply as traders bet on bigger cuts, but stocks fell too, because recession fears hurt
      earnings. Defensive sectors such as utilities and staples held up best, and small caps and
      tech fell the most.
    lesson: Weak data is good for stocks only while it means rate cuts without a recession. Past a point it turns into recession fear.

  - id: jobs-2024-10
    date: 2024-10-04
    category: Jobs
    title: September 2024 jobs report
    brief: >-
      Friday 8:30 ET. The Fed had cut rates by 0.5 point in September and markets priced
      more big cuts. Economists expected about 150,000 jobs. The report showed 254,000,
      unemployment fell to 4.1%, and the two prior months were revised up.
    focus: spx
    sectors: [XLF, XLU, XLRE, XLK]
    explanation: >-
      Unlike early 2023, inflation was no longer the main fear, so strong jobs read as "no
      recession", which is good for stocks. Traders dropped bets on more 0.5-point cuts, so the
      2-year yield jumped. Stocks rose, led by cyclical sectors such as banks, while
      rate-sensitive sectors such as utilities and real estate lagged.
    lesson: The same data point means different things depending on whether the market fears inflation or recession.

  - id: jobs-2025-08
    date: 2025-08-01
    category: Jobs
    title: July 2025 jobs report
    brief: >-
      Friday 8:30 ET. The Fed had held rates two days earlier, and new US tariffs on many trading
      partners were taking effect. Economists expected about 100,000 jobs. The report showed
      73,000, and the previous two months were revised down by a combined 258,000, showing
      hiring had been far weaker than reported.
    focus: spx
    sectors: [XLK, XLU, XLP, XLY]
    explanation: >-
      The huge downward revisions changed the picture of the economy, not just one month.
      Traders priced a September rate cut almost fully, so the 2-year yield fell sharply and the
      dollar weakened. Stocks fell on growth fears, with defensive sectors holding up better than
      consumer discretionary and tech.
    lesson: Revisions can matter more than the headline number. Always check them.

  - id: fed-2022-06
    date: 2022-06-15
    category: Fed
    title: June 2022 Fed decision
    brief: >-
      Wednesday 2:00 ET. Days earlier a hot CPI report had pushed the S&P 500 into a bear market.
      On Monday the WSJ reported the Fed was likely to raise rates by 0.75 point instead of the
      0.5 point it had signaled, and markets quickly priced that in. The Fed then raised rates by
      0.75 point, its biggest hike since 1994. Powell said such large moves would not be common.
    focus: spx
    sectors: [XLK, XLE, XLF, XLU]
    explanation: >-
      The big hike was already priced in after the WSJ report, so the decision itself was not a
      shock. Powell's comment that 0.75-point moves would be uncommon read as less hawkish than
      feared, so stocks rallied from oversold levels. This is "buy the rumor, sell the news" in
      reverse: the bad news was sold in advance.
    lesson: Once news is fully priced in, the reaction comes from the tone and the details.

  - id: fed-2022-jh
    date: 2022-08-26
    category: Fed
    title: Powell at Jackson Hole, August 2022
    brief: >-
      Friday 10:00 ET. Stocks had rallied about 15% from their June lows, partly on hopes the Fed
      would soon slow its hikes and cut rates in 2023. Powell gave a short, blunt speech: the Fed
      would keep raising rates, keep them high "for some time", and accept "some pain" for
      households and businesses to beat inflation.
    focus: spx
    sectors: [XLK, XLE, XLU, XLP]
    explanation: >-
      Powell deliberately pushed back on the market's hopes for a pivot. The speech removed the
      basis of the summer rally, so stocks fell sharply, led by tech and other growth stocks.
      Defensive sectors fell less.
    lesson: When the Fed explicitly pushes back on what markets are pricing, believe it.

  - id: fed-2023-12
    date: 2023-12-13
    category: Fed
    title: December 2023 Fed decision
    brief: >-
      Wednesday 2:00 ET. Inflation had cooled through the autumn. The Fed held rates at
      5.25–5.50%, as expected. Its new projections showed officials expecting three rate cuts in
      2024, more than in September, and Powell said cuts were now being discussed.
    focus: spx
    sectors: [IWM, XLRE, XLE, XLP]
    explanation: >-
      The Fed itself signaled a pivot, much earlier than many expected. Yields dropped sharply,
      the 10-year falling toward 4%, and the dollar weakened. Rate-sensitive assets such as small
      caps and real estate surged, and the Dow closed at a record.
    lesson: A shift in the Fed's projections can matter more than the rate decision itself.

  - id: fed-2024-09
    date: 2024-09-18
    category: Fed
    title: September 2024 Fed decision
    brief: >-
      Wednesday 2:00 ET. This was the Fed's first meeting with a cut expected since 2020, and
      the debate was whether it would cut by 0.25 or 0.5 point. Markets had moved toward 0.5 in
      the days before. The Fed cut by 0.5 point. Powell said it was not a sign of worry about
      the economy and that 0.5 should not be seen as the new pace.
    focus: spx
    sectors: [IWM, XLF, XLK, XLU]
    explanation: >-
      The large cut was largely priced in, and stocks had rallied into the meeting. With no new
      surprise and some pushback on the pace of future cuts, the reaction was a small dip, a
      classic "sell the news". Longer-term yields actually rose.
    lesson: The event everyone expects usually has a small reaction, often the opposite of the "obvious" one.

  - id: fed-2024-12
    date: 2024-12-18
    category: Fed
    title: December 2024 Fed decision
    brief: >-
      Wednesday 2:00 ET. Stocks were near record highs. The Fed was expected to cut rates by
      0.25 point, and it did. But its new projections showed only two cuts expected in 2025,
      down from four in September, and higher inflation forecasts. Powell said the Fed would
      be more cautious about further cuts.
    focus: spx
    sectors: [IWM, XLRE, XLK, XLU]
    explanation: >-
      The cut was expected; the projections were the hawkish surprise. Yields and the dollar
      rose and volatility spiked. Small caps and real estate fell the most because they rely
      most on cheap credit. Stocks priced for perfection had little cushion.
    lesson: A "hawkish cut" can hit stocks harder than a hike when the market was priced for more easing.

  - id: earn-nflx-2022-04
    date: 2022-04-20
    category: Earnings
    title: Netflix Q1 2022 earnings
    brief: >-
      Reported after the close on Tuesday April 19. Netflix had forecast adding 2.5 million
      subscribers in the quarter. Instead it lost 200,000, its first decline in more than a
      decade, partly from leaving Russia. It forecast losing another 2 million in the next
      quarter, said about 100 million households shared passwords, and said it would consider an
      ad-supported plan.
    focus: NFLX
    stock: NFLX
    sectors: [XLC, XLK, XLP, XLE]
    explanation: >-
      Netflix was valued as a growth story built on subscriber growth. A loss of subscribers,
      plus a forecast of more losses, broke that story, so investors re-valued it as a mature
      business. The stock collapsed and dragged other streaming and media names down with it.
    lesson: When the core growth story breaks, a stock re-rates, and the drop can be far bigger than the miss.

  - id: earn-tgt-2022-05
    date: 2022-05-18
    category: Earnings
    title: Target Q1 2022 earnings
    brief: >-
      Reported before the open on Wednesday. A day earlier Walmart had cut its profit forecast
      because of higher fuel, freight and wage costs. Target's sales rose, but profit roughly
      halved and badly missed forecasts. Target said costs had surged, shoppers were shifting
      from TVs and appliances to essentials, and it was stuck with too much inventory.
    focus: TGT
    stock: TGT
    sectors: [XLY, XLP, XLK, XLE]
    explanation: >-
      Target and Walmart together showed inflation hitting retailers from both sides: higher
      costs and shoppers trading down. That raised fears for corporate profit margins across
      the economy, not just at Target. Target fell more than 20%, and the selling spread to
      retail and the whole market, with consumer stocks hit hardest.
    lesson: One company's results can move the market when they reveal something about the whole economy.

  - id: earn-meta-2022-10
    date: 2022-10-27
    category: Earnings
    title: Meta Q3 2022 earnings
    brief: >-
      Reported after the close on Wednesday October 26. Revenue fell for the second quarter in a
      row as the ad market weakened. Profit fell by about half. Meta said spending would rise
      sharply in 2023, and Reality Labs, its metaverse unit, had lost $3.7 billion in the quarter,
      with bigger losses to come. Alphabet and Microsoft had also reported disappointing results
      that week.
    focus: META
    stock: META
    sectors: [XLC, XLK, XLE, XLP]
    explanation: >-
      Investors were already worried about weak ads; what broke confidence was management
      choosing to spend far more on an unproven bet while profits fell. The stock dropped about
      a quarter in one day to its lowest level since 2016.
    lesson: Investors punish spending they don't believe in, especially when the core business is shrinking.

  - id: earn-meta-2023-02
    date: 2023-02-02
    category: Earnings
    title: Meta Q4 2022 earnings
    brief: >-
      Reported after the close on Wednesday February 1. After a terrible 2022, Meta's revenue
      fell 4% but beat estimates, and its revenue forecast for the next quarter was above
      expectations. Zuckerberg called 2023 the "year of efficiency", Meta cut its 2023 spending
      forecast, and it announced a $40 billion share buyback.
    focus: META
    stock: META
    sectors: [XLC, XLK, XLE, XLU]
    explanation: >-
      The stock had been priced for disaster. Cost discipline and a buyback were exactly what
      investors had demanded in October, so the stock jumped more than 20%. It's the mirror image
      of the October 2022 drop.
    lesson: Low expectations plus a change in management behavior can produce a huge upside move.

  - id: earn-nvda-2023-05
    date: 2023-05-25
    category: Earnings
    title: Nvidia Q1 FY2024 earnings
    brief: >-
      Reported after the close on Wednesday May 24. ChatGPT had launched six months earlier and
      AI was the hot theme, but Nvidia's overall revenue had been falling as gaming chip sales
      slumped. Analysts expected next-quarter revenue guidance of about $7.2 billion. Nvidia
      guided to about $11 billion, citing surging demand for its data center chips used to train
      AI models.
    focus: NVDA
    stock: NVDA
    sectors: [SMH, XLK, XLE, XLP]
    explanation: >-
      This was one of the largest guidance beats in history for a company that size, and it
      showed AI demand was real and huge. Nvidia jumped about a quarter, and other AI-linked
      chip stocks rallied with it. It set off the 2023 AI trade.
    lesson: Guidance matters more than last quarter's results; a giant guidance beat can reset a whole sector.

  - id: earn-meta-2024-02
    date: 2024-02-02
    category: Earnings
    title: Meta Q4 2023 earnings
    brief: >-
      Reported after the close on Thursday February 1. Meta's quarterly revenue grew about 25%
      and profit roughly tripled. Its revenue forecast for the next quarter was above estimates.
      It announced its first-ever dividend and a new $50 billion buyback. (The January jobs
      report also came out the next morning.)
    focus: META
    stock: META
    sectors: [XLC, XLK, XLU, XLE]
    explanation: >-
      Strong growth, a better forecast and the first dividend (a sign of a mature, cash-rich
      company) combined into a huge move: Meta added roughly $200 billion in market value in a
      day, then a record.
    lesson: When strong results come with capital returns, a mega-cap can still move like a small stock.

  - id: earn-nvda-2024-08
    date: 2024-08-29
    category: Earnings
    title: Nvidia Q2 FY2025 earnings
    brief: >-
      Reported after the close on Wednesday August 28. Nvidia was the most-watched stock in the
      market and had beaten estimates by wide margins for over a year. Revenue was about $30
      billion, above the roughly $28.7 billion expected. It guided to about $32.5 billion next
      quarter, slightly above consensus but below the highest estimates, and gross margins dipped.
    focus: NVDA
    stock: NVDA
    sectors: [SMH, XLK, XLU, XLE]
    explanation: >-
      The results were strong, but the bar was far higher than the official consensus. Investors
      wanted another huge beat like the ones before, and a modest beat plus slightly lower
      margins disappointed. The stock fell.
    lesson: Beating the consensus isn't enough if the "whisper number" is higher.

  - id: shock-ukraine-2022
    date: 2022-02-24
    category: Shock
    title: Russia invades Ukraine
    brief: >-
      Before dawn on Thursday, Russia launched a full-scale invasion of Ukraine. Brent crude
      briefly rose above $100 a barrel for the first time since 2014, and US stock futures fell
      sharply overnight. The Nasdaq was already more than 20% below its high on fears of Fed rate
      hikes. During the day the US announced new sanctions.
    focus: spx
    sectors: [XLE, XLK, XLF, XLU]
    explanation: >-
      Stocks fell sharply at the open, then reversed and closed higher, led by tech. Much of the
      fear was already priced in after weeks of warnings, and traders reasoned the war might slow
      the Fed's hikes. Sanctions avoided targeting Russian energy at first, which helped.
    lesson: Geopolitical shocks often cause a quick drop that reverses. Ask what is already priced in and what the Fed might do.

  - id: shock-svb-2023
    date: 2023-03-13
    category: Shock
    title: Silicon Valley Bank aftermath
    brief: >-
      Monday. Silicon Valley Bank failed on Friday after a run on deposits, and Signature Bank
      was closed on Sunday. Sunday night, regulators said all depositors at both banks would be
      protected, and the Fed launched a new lending program for banks. Before SVB failed, markets
      had been pricing a 0.5-point Fed hike later that month.
    focus: KRE
    stock: KRE
    sectors: [KRE, XLF, XLK, XLU]
    explanation: >-
      The rescue protected depositors, but investors still feared runs at other regional banks
      with similar problems (uninsured deposits and losses on bonds). Regional bank stocks
      crashed even as big banks held up better. Traders bet the Fed would stop hiking, so the
      2-year yield had one of its biggest falls in decades, and gold rose as a haven.
    lesson: In a banking scare, money flees the weakest links and rushes into Treasuries; rate-hike bets can vanish in a day.

  - id: shock-carry-2024
    date: 2024-08-05
    category: Shock
    title: Yen carry trade unwind
    brief: >-
      Monday. Friday's weak US jobs report had raised recession fears. The Bank of Japan had
      unexpectedly raised rates the week before, and the yen was surging. That forced traders who
      had borrowed cheap yen to buy higher-yielding assets (the "carry trade") to sell. Overnight,
      Japan's Nikkei index fell more than 12%, its worst day since 1987.
    focus: spx
    sectors: [SMH, XLK, XLU, XLP]
    explanation: >-
      Forced selling spread across markets as leveraged positions were unwound, and the VIX
      briefly spiked to its highest level since 2020. Crowded tech trades fell hard, but almost
      nothing was spared: even utilities and staples fell, because forced sellers sell whatever
      they can. Within days markets largely recovered, because the selling was driven by
      positioning, not a change in the economy.
    lesson: Sell-offs driven by forced selling are violent but often short-lived.

  - id: shock-election-2024
    date: 2024-11-06
    category: Shock
    title: 2024 US election result
    brief: >-
      Wednesday. Overnight, Donald Trump won the presidential election, and Republicans won the
      Senate. His campaign had promised tariffs, tax cuts and lighter regulation. Many analysts
      had expected a long, uncertain vote count; instead the result was clear by morning.
    focus: spx
    sectors: [IWM, KRE, XLU, XLRE]
    explanation: >-
      Markets priced in faster growth, looser regulation and higher deficits, and the uncertainty
      cleared quickly. Stocks rose broadly, with small caps and banks leading on hopes for tax cuts
      and deregulation. Treasury yields and the dollar rose on expectations of bigger deficits,
      tariffs and fewer Fed cuts. Rate-sensitive utilities and real estate lagged.
    lesson: Markets trade the expected policy mix (growth, deficits, tariffs), and removing uncertainty is itself a boost.

  - id: shock-deepseek-2025
    date: 2025-01-27
    category: Shock
    title: DeepSeek AI model
    brief: >-
      Monday. Over the weekend, attention exploded around DeepSeek, a Chinese AI start-up whose
      reasoning model matched top US models on several tests. DeepSeek said it had trained an
      earlier model for under $6 million using less advanced Nvidia chips, a tiny fraction of what
      US labs spend. Its app hit No. 1 on Apple's US App Store.
    focus: NVDA
    stock: NVDA
    sectors: [SMH, XLU, XLP, XLV]
    explanation: >-
      If AI could be built far more cheaply, the giant spending on Nvidia chips and data centers
      might shrink. Nvidia fell about 17%, losing a record ~$590 billion in market value in a day.
      Chipmakers and power companies tied to AI data centers fell sharply, while defensive
      sectors rose as money rotated out of AI winners.
    lesson: A threat to the core assumption behind a crowded trade can hit even the market's biggest company.

  - id: shock-tariffs-2025-04
    date: 2025-04-03
    category: Shock
    title: April 2025 "reciprocal" tariffs
    brief: >-
      Announced after the close on Wednesday April 2. President Trump unveiled "reciprocal"
      tariffs: a 10% minimum on imports from almost every country, and much higher rates on many,
      including 34% more on China and 20% on the EU. The rates were far higher than most investors
      expected.
    focus: spx
    sectors: [XLK, XLY, XLP, XLU]
    explanation: >-
      The tariffs were much larger than expected, raising fears of recession plus higher prices.
      Stocks had their worst day since 2020, led by companies with global supply chains such as
      Apple and retailers. Unusually, the dollar fell rather than acting as a haven, because
      investors questioned US policy itself. Oil fell on recession fears, and defensive sectors
      held up best.
    lesson: When the shock comes from US policy, the usual havens (the dollar) may not behave as usual.

  - id: shock-tariff-pause-2025
    date: 2025-04-09
    category: Shock
    title: 90-day tariff pause
    brief: >-
      Wednesday. After four days of heavy losses following the April tariffs, and with the
      Treasury market showing stress, President Trump announced at about 1:20 ET a 90-day pause on
      most of the higher reciprocal tariffs, keeping the 10% baseline. Tariffs on China were raised
      further.
    focus: spx
    sectors: [XLK, SMH, XLP, XLU]
    explanation: >-
      Markets were deeply oversold and heavily hedged. The pause removed the worst-case scenario,
      so traders rushed to buy back stocks and close bearish bets. The S&P 500 rose more than 9%,
      one of its best days ever, led by tech and chipmakers. Defensive sectors lagged.
    lesson: The biggest up days happen in bear markets, when positioning is extreme and a catalyst flips sentiment.

  - id: shock-iran-2025
    date: 2025-06-13
    category: Shock
    title: Israel strikes Iran, June 2025
    brief: >-
      Friday. Overnight, Israel launched airstrikes on Iran's nuclear facilities and military
      leaders. Iran promised retaliation. Iran is a major oil producer and borders the Strait of
      Hormuz, through which about a fifth of the world's oil passes. Oil prices jumped overnight.
    focus: USO
    stock: USO
    sectors: [XLE, XLK, XLY, XLU]
    explanation: >-
      Oil rose sharply on fears of supply disruption, energy and defense stocks rose, and the
      broad market fell more modestly as investors cut risk. Airlines, which suffer from higher
      fuel costs, were among the weakest stocks. Oil supply was not actually disrupted, so the
      move depended on how the conflict escalated next.
    lesson: For Middle East conflicts, watch oil first; stocks react through energy prices and risk appetite.
