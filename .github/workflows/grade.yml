name: Grade calls

# After the US close (and again next morning, when FRED yields arrive),
# grade pending calls, update the scorecard and post results on each issue.
on:
  schedule:
    - cron: "40 21 * * 1-5"   # 4:40pm ET in winter / 5:40pm in summer
    - cron: "0 14 * * 1-6"    # next morning, picks up Treasury yields
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: journal-writes
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Grade
        run: |
          python scripts/grade.py > graded.json
          cat graded.json
          python scripts/notify.py tmp-comments < graded.json

      - name: Update scorecard
        run: python scripts/scorecard.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calls/ results/ README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Grade calls and update scorecard"
            git pull --rebase
            git push
          fi

      - name: Post results on issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for f in tmp-comments/*.md; do
            n=$(basename "$f" .md)
            gh issue comment "$n" --body-file "$f"
            gh issue close "$n" --reason completed
          done
